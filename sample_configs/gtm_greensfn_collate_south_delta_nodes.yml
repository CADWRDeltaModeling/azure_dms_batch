resource_group: azure_model_batch
location: westus2
job_name: gtm_greensfn_collate_south_delta_nodes
batch_account_name: dwrmodelingbatchaccount
storage_account_name: dwrmodelingstore
storage_container_name: da-climatology
# lightweight single-task post-processing job -- no DSM2 run, just downloading
# small CSVs and doing pandas aggregation.
vm_size: Standard_D64s_v3
num_hosts: 1
num_cores: 2
task_slots_per_node: 1
container_image_name: 'almalinux:8.7'

# must match the sweep job's output_dir (gtm_greensfn_south_delta_nodes.yml) --
# this is where envelope_metrics_gtm_<node>_<pulse_start_date>.csv files were
# uploaded to, one per (node, pulse) run.
output_dir: "south_delta_nodes"

# --- per-task resource files: the collation script (+ the rest of the shared
# da_climatology_scripts/ prefix, harmless if unused by this job), plus the
# channel connectivity + station-position tables needed by
# distance_visibility_scatter.py's hydraulic-network distance calculation
# (same OUTPUT_CHANNEL include files studies/zero_ec_run/gtm.inp itself uses).
resource_files:
  - file_path: "."
    blob_prefix: "da_climatology_scripts"
  - file_path: "."
    blob_prefix: "dsm2_studies/common_input/channel_std_delta_grid.inp"
  - file_path: "."
    blob_prefix: "dsm2_studies/common_input/output_ec_calib.inp"
  - file_path: "."
    blob_prefix: "dsm2_studies/common_input/output_ec_calib_rki.inp"
  - file_path: "."
    blob_prefix: "dsm2_studies/common_input/output_ec_calib_mss.inp"
  - file_path: "."
    blob_prefix: "dsm2_studies/common_input/output_ec_datastore.inp"

output_files:
  - file_pattern: 'collated/*.csv'
    path: 'greenfn_runs/{output_dir}/collated'
    upload_condition: 'taskcompletion'
  # ** matches subfolders too (drilldowns/, seasonal_overlays/, station_contribs/)
  # -- Azure Batch preserves each matched file's relative path under `path`.
  - file_pattern: 'collated/plots/**/*.png'
    path: 'greenfn_runs/{output_dir}/collated/plots'
    upload_condition: 'taskcompletion'
  - file_pattern: 'collated/plots/**/*.csv'
    path: 'greenfn_runs/{output_dir}/collated/plots'
    upload_condition: 'taskcompletion'

task_name: 'collate_envelope_metrics_{output_dir}'

# Passed through as real environment variables to the task (not embedded as
# literal text in `command` below) -- keeps the task's actual commandLine tiny
# regardless of how large run_collation.sh grows, and avoids the whole command
# block being subject to Python str.format() brace-escaping pitfalls. Azure
# Batch enforces a hard ~32KB task commandLine size limit; a previous version of
# this job inlined the full pipeline here and silently produced zero tasks once
# it crept past that limit (dmsbatch's create_tasks() didn't surface the
# per-task creation error -- see batch.py's submit_tasks fix).
environment_variables:
  STORAGE_ACCOUNT_NAME: "{storage_account_name}"
  STORAGE_CONTAINER_NAME: "{storage_container_name}"
  OUTPUT_DIR: "{output_dir}"
  SAS: "{sas}"

command: |
  bash da_climatology_scripts/postprocessing/run_collation.sh

task_ids: |
  tasks = [[0]]
  tasks

app_pkgs:
  - name: dsm2_hydro_gtm
  - name: da_climatology

template_name: "dsm2_hydro_gtm_alma87"
